[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "djamp"
version = "0.1.0"
description = "A terminal interface for go-librespot and Spotify DJ X"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []
classifiers = [
    "Environment :: Console :: Curses",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio :: Players",
]

[project.scripts]
djamp = "djamp:main"

[tool.setuptools]
py-modules = ["djamp"]
